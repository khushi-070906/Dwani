# Runs every test on every push and pull request:
#   - 203 Python tests (server, pipeline, launcher, licensing caps, pre-flight,
#     help links, benchmarks, ...)
#   - 86 browser tests: the attendee page, presenter dashboard, help page and
#     home page simulated in jsdom (reconnects, accessibility, mic meter, nav)
# A red X on a commit means something broke -- fix it before tagging a release.
name: tests
on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # a hanging test fails the run instead of burning hours
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-desktop.txt
      - name: Install (app runtime deps, no build tools)
        run: |
          grep -v -i -E "^(nuitka|pyinstaller)" requirements-desktop.txt > /tmp/req.txt
          pip install -r /tmp/req.txt pytest httpx reportlab
      - name: Run tests
        run: pytest -q

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tests/js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-audit --no-fund
      - run: npm test

  dwaniforms-ui:
    # The DwaniForms kiosk page driven against a real DwaniForms server (typed answers, demo records)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install fastapi uvicorn pydantic
      - name: Start DwaniForms
        run: |
          python -m dwaniforms.standalone --text-only --demo-records --port 8130 > dwaniforms.log 2>&1 &
          for i in $(seq 30); do curl -sf http://127.0.0.1:8130/form/forms > /dev/null && break; sleep 1; done
      - name: Kiosk UI test
        working-directory: tests/js
        run: |
          npm install --no-audit --no-fund
          DWANIFORMS_URL=http://127.0.0.1:8130 node dwaniforms_kiosk.test.js
      - name: No server errors
        run: "! grep -q Traceback dwaniforms.log || (cat dwaniforms.log; exit 1)"

  security:
    # Known vulnerabilities in the online app's dependencies (fails the check so they get upgraded)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: pip-audit -r dwaniforms/requirements-web.txt
