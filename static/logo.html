<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DwaniLive Logo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Mukta:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --accent-deep: #a8460c;
    --accent-2: #c81e5e;
    --indigo: #223367;
    --ink-dim: #5c4433;
    --font-display: "Rozha One", "Noto Serif Devanagari", Georgia, serif;
    --font-body: "Mukta", "Noto Sans", "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  }
  html, body {
    margin: 0; height: 100%;
    display: flex; align-items: center; justify-content: center;
    background: #fdf6e7;
  }
  .brand-name {
    display: inline-flex;
    align-items: baseline;
    gap: 0.1em;
    font-family: var(--font-display);
    font-size: 6rem;
    font-weight: 400;
    letter-spacing: -0.01em;
  }
  .brand-name .dwani {
    background: linear-gradient(120deg, var(--accent-deep), var(--accent-2), var(--indigo));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .brand-name .live {
    color: var(--ink-dim);
    font-family: var(--font-body);
    font-size: 0.32em;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
</style>
</head>
<body>
  <span class="brand-name"><span class="dwani" lang="hi">ध्वनि</span><span class="live">Live</span></span>
</body>
</html>
