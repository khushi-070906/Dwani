    if (w.in) return w.in.indexOf(v) >= 0;
    if (w.not_in) return w.not_in.indexOf(v) < 0;
    if (w.eq) return v === w.eq;
    return true;
  }
  function stepsNow() { return questions.filter(applicable); }

  function show(which) { ["start", "ask", "out"].forEach(function (id) { $(id).hidden = id !== which; }); }

  function getQuestions() {
    return fetch("yojana/questions?lang=" + lang).then(function (r) { if (!r.ok) throw 0; return r.json(); }).then(function (q) { questions = q; });
  }

  function begin() {
    facts = {}; trail = []; last = null;
    (questions.length ? Promise.resolve() : getQuestions()).then(function () { ask(questions[0]); }).catch(function () { alert(t("err")); });
  }

  function ask(q) {
    current = q; show("ask");
    var steps = stepsNow(), i = steps.indexOf(q);
    $("count").textContent = (i + 1) + " " + t("of") + " ~" + steps.length;
    $("fill").style.width = Math.round((i / Math.max(steps.length, 1)) * 100) + "%";
    $("back").hidden = !trail.length;
    var h = (HEAD[q.id] || [q.prompt, q.prompt])[lang === "hi" ? 0 : 1];
    $("qh").textContent = h;
    var box = $("answers"); box.textContent = "";
    function opt(label, value, cls) {
      var b = document.createElement("button"); b.type = "button"; b.className = "opt" + (cls ? " " + cls : ""); b.textContent = label;
      b.onclick = function () { answer(q, value); }; return b;
    }
    if (q.kind === "choice") {
      var g = document.createElement("div"); g.className = "opts" + (q.options.length <= 3 ? " two" : "");
      q.options.forEach(function (v) { g.appendChild(opt(OPT[v] ? OPT[v][lang === "hi" ? 0 : 1] : v, v)); });
      box.appendChild(g);
    } else if (q.kind === "yesno") {
      var y = document.createElement("div"); y.className = "opts two";
      y.appendChild(opt(t("yes"), "Yes")); y.appendChild(opt(t("no"), "No")); box.appendChild(y);
    } else if (q.id === "annual_income") {
      var gi = document.createElement("div"); gi.className = "opts";
      INCOME.forEach(function (b) { gi.appendChild(opt(pick([b[1], b[2]]), b[0])); }); box.appendChild(gi);
    } else {
      var row = document.createElement("div"); row.className = "num";
      var inp = document.createElement("input"); inp.type = "number"; inp.inputMode = q.id === "age" ? "numeric" : "decimal"; inp.min = q.min || 0; inp.max = q.max;
      inp.step = q.id === "age" ? "1" : "any"; inp.id = "num-in"; inp.setAttribute("aria-label", $("qh").textContent);
      if (q.id === "land_acres") inp.placeholder = t("unit_acres");
      var go = document.createElement("button"); go.type = "button"; go.className = "btn solid"; go.textContent = t("next");
      var err = document.createElement("p"); err.className = "err"; err.setAttribute("role", "alert");
      function submit() {
        var n = parseFloat(inp.value);
        if (!isFinite(n)) { err.textContent = t("need_num"); return; }
        if (n < (q.min || 0) || n > q.max) { err.textContent = t("range") + " " + (q.min || 0) + " – " + q.max; return; }
        answer(q, n);
      }
      go.onclick = submit; inp.onkeydown = function (e) { if (e.key === "Enter") { e.preventDefault(); submit(); } };
      row.appendChild(inp); row.appendChild(go); box.appendChild(row); box.appendChild(err);
      setTimeout(function () { inp.focus(); }, 0);
    }
    if (!q.required) { var sk = opt(t("skip"), undefined, "skip"); sk.style.marginTop = "10px"; box.appendChild(sk); }
    $("heard").textContent = ""; $("mic").classList.remove("on");
    if (q.kind !== "number" || q.id === "annual_income") $("qh").focus();
  }

  function answer(q, value) {
    if (value === undefined) delete facts[q.id]; else facts[q.id] = value;
    trail.push(q);
    // answers that no longer apply (changed gender after going back) must not linger
    questions.forEach(function (x) { if (!applicable(x)) delete facts[x.id]; });
    var steps = stepsNow(), next = steps[steps.indexOf(q) + 1];
    if (next) ask(next); else finish();
  }

  $("back").onclick = function () {
    var prev = trail.pop(); if (!prev) return;
    delete facts[prev.id]; ask(prev);
  };

  function finish() {
    show("out"); $("result").textContent = t("loading");
    fetch("yojana/advise", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ lang: lang, facts: facts }) })
      .then(function (r) { if (!r.ok) throw 0; return r.json(); })
      .then(function (d) { last = d; render(d); })
      .catch(function () { $("result").textContent = t("err"); });
  }

  function schemeCard(s, maybe) {
    var d = document.createElement("div"); d.className = "scheme";
    var h = document.createElement("h3"); h.textContent = s.name; d.appendChild(h);
    var b = document.createElement("p"); b.className = "ben"; b.textContent = s.benefit; d.appendChild(b);
    var a = document.createElement("p"); a.className = "how"; a.textContent = t("how") + ": " + s.apply; d.appendChild(a);
    if (maybe && s.reasons && s.reasons.length) { var w = document.createElement("p"); w.className = "why"; w.textContent = s.reasons.join(" · "); d.appendChild(w); }
    return d;
  }

  function render(d) {
    var box = $("result"); box.textContent = "";
    var n = d.likely.length, m = d.maybe.length;
    var p = document.createElement("p"); p.className = "total";
    if (n) { p.textContent = t("total_pre") + " "; var bn = document.createElement("b"); bn.textContent = n; p.appendChild(bn); p.appendChild(document.createTextNode(" " + t("total_post"))); }
    else p.textContent = t("total_none");
    box.appendChild(p);
    if (m) { var sp = document.createElement("p"); sp.className = "sub"; sp.textContent = "+ " + m + " " + t("more"); box.appendChild(sp); }
    if (n) {
      var sh = document.createElement("div"); sh.className = "share";
      var b1 = document.createElement("button"); b1.type = "button"; b1.className = "go"; b1.textContent = t("share"); b1.onclick = shareCard;
      var b2 = document.createElement("a"); b2.className = "btn"; b2.style.textAlign = "center"; b2.style.textDecoration = "none"; b2.style.lineHeight = "30px";
      b2.target = "_blank"; b2.rel = "noopener"; b2.textContent = t("share_wa"); b2.href = "https://wa.me/?text=" + encodeURIComponent(shareText() + " " + shareUrl());
      var b3 = document.createElement("button"); b3.type = "button"; b3.className = "btn"; b3.id = "copy-list"; b3.textContent = t("copy");
      var note = document.createElement("p"); note.className = "meta"; note.setAttribute("role", "status");
      b3.onclick = function () { copyList(function (ok) { note.textContent = t(ok ? "copied" : "copy_failed"); }); };
      sh.appendChild(b1); sh.appendChild(b2); sh.appendChild(b3); sh.appendChild(note); box.appendChild(sh);
      var g = document.createElement("h2"); g.className = "group"; g.textContent = t("likely"); box.appendChild(g);
      d.likely.forEach(function (s) { box.appendChild(schemeCard(s, false)); });
    }
    if (m) { var g2 = document.createElement("h2"); g2.className = "group"; g2.textContent = t("maybe"); box.appendChild(g2); d.maybe.forEach(function (s) { box.appendChild(schemeCard(s, true)); }); }
    var meta = document.createElement("p"); var stale = d.likely.concat(d.maybe).some(function (s) { return s.stale; });
    meta.className = "meta" + (stale ? " stale" : "");
    meta.textContent = (d.reviewed ? t("reviewed") + ": " + niceDate(d.reviewed) + ". " : "") + (stale ? t("stale") + " " : "") + t("disc");
    box.appendChild(meta);
    if (n + m) {
      var cta = document.createElement("div"); cta.className = "cta"; cta.appendChild(document.createTextNode(t("cta") + " "));
      var l = document.createElement("a"); l.href = "./"; l.textContent = t("cta_link"); cta.appendChild(l); box.appendChild(cta);
    }
    var again = document.createElement("button"); again.type = "button"; again.className = "btn"; again.style.marginTop = "18px"; again.textContent = t("again");
    again.onclick = function () { show("start"); $("start-h").focus(); }; box.appendChild(again);
    $("start-h").tabIndex = -1;
    box.scrollIntoView({ behavior: "auto", block: "start" });
  }

  // Plain text for SMS, notes and chat apps that are not WhatsApp: scheme names only (same rule as the picture), then the link.
  function listText() {
    var names = last ? last.likely.map(function (s) { return "\u2022 " + s.name; }) : [];
    return [shareText()].concat(names, [shareUrl()]).join("\n");
  }
  function copyList(done) {
    var text = listText();
    function old() {
      var ta = document.createElement("textarea"); ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      var ok = false; try { ok = document.execCommand("copy"); } catch (e) {}
      document.body.removeChild(ta); done(ok);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { done(true); }, old); else old();
  }

  // "2026-10-07" is read by few people; "7 अक्टूबर 2026" is read by everyone.
  var MONTHS = { hi: ["जनवरी", "फ़रवरी", "मार्च", "अप्रैल", "मई", "जून", "जुलाई", "अगस्त", "सितंबर", "अक्टूबर", "नवंबर", "दिसंबर"],
                 en: ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"] };
  function niceDate(iso) {
    var m = /^(\d{4})-(\d\d)-(\d\d)$/.exec(iso || "");
    if (!m || +m[2] < 1 || +m[2] > 12) return iso || "";
    return +m[3] + " " + MONTHS[lang][+m[2] - 1] + " " + m[1];
  }

  function shareUrl() { return location.origin + location.pathname.replace(/\/$/, ""); }
  function shareText() { return t("share_text").replace("{n}", last ? last.likely.length : ""); }

  // The card is drawn here, in the browser, from scheme names only. Nothing about the person (age, gender, income, ...) is on it.
  function drawCard() {
    var W = 1080, H = 1350, c = document.createElement("canvas"); c.width = W; c.height = H; var x = c.getContext("2d");
    x.fillStyle = "#1F5E4D"; x.fillRect(0, 0, W, H);
    x.fillStyle = "#FFFFFF"; roundRect(x, 60, 60, W - 120, H - 120, 40); x.fill();
    x.fillStyle = "#1F5E4D"; x.beginPath(); x.arc(150, 150, 46, 0, 7); x.fill();
    x.fillStyle = "#fff"; x.font = "52px 'Rozha One', serif"; x.textAlign = "center"; x.textBaseline = "middle"; x.fillText("ध", 150, 154);
    x.textAlign = "left"; x.fillStyle = "#1E2A44"; x.font = "44px 'Rozha One', serif"; x.fillText("ध्वनिYojana", 220, 150);
    var n = last.likely.length;
    x.textBaseline = "alphabetic"; x.fillStyle = "#1E2A44"; x.font = "600 54px 'Source Serif 4', 'Mukta', serif"; x.fillText(t("card_title"), 110, 300);
    x.fillStyle = "#1F5E4D"; x.font = "700 230px 'Source Serif 4', serif"; x.fillText(String(n), 110, 540);
    var numW = x.measureText(String(n)).width;          // measured in the big font, before the font changes
    x.fillStyle = "#1E2A44"; x.font = "600 64px 'Mukta', sans-serif"; x.fillText(t("card_n"), 110 + numW + 24, 540);
    x.font = "600 44px 'Mukta', sans-serif"; var y = 650, names = last.likely.slice(0, 5);
    names.forEach(function (s) {
      x.fillStyle = "#1F5E4D"; x.beginPath(); x.arc(125, y - 14, 10, 0, 7); x.fill();
      x.fillStyle = "#1E2A44"; x.fillText(fit(x, s.name, W - 300), 160, y); y += 78;
    });
    if (n > names.length) { x.fillStyle = "#5B6579"; x.fillText("+ " + (n - names.length) + " " + t("card_more"), 160, y); }
    x.fillStyle = "#EEF0EA"; roundRect(x, 110, H - 330, W - 220, 170, 24); x.fill();
    x.fillStyle = "#3F4A63"; x.font = "400 34px 'Mukta', sans-serif"; x.fillText(t("card_foot"), 140, H - 270);
    x.fillStyle = "#1F5E4D"; x.font = "700 40px 'Mukta', sans-serif"; x.fillText(shareUrl().replace(/^https?:\/\//, ""), 140, H - 212);
    x.fillStyle = "#5B6579"; x.font = "400 28px 'Mukta', sans-serif"; x.fillText(t("card_note"), 110, H - 110);
    return c;
  }
  function fit(x, s, w) { while (x.measureText(s).width > w && s.length > 4) s = s.slice(0, -2); return s; }
  function roundRect(x, a, b, w, h, r) { x.beginPath(); x.moveTo(a + r, b); x.arcTo(a + w, b, a + w, b + h, r); x.arcTo(a + w, b + h, a, b + h, r); x.arcTo(a, b + h, a, b, r); x.arcTo(a, b, a + w, b, r); x.closePath(); }

  function shareCard() {
    var fonts = ["52px 'Rozha One'", "600 54px 'Source Serif 4'", "700 40px 'Mukta'", "400 30px 'Mukta'"];
    Promise.all(fonts.map(function (f) { return document.fonts ? document.fonts.load(f, "धYojana0") : null; })).catch(function () {}).then(function () {
      var c = drawCard();
      c.toBlob(function (blob) {
        var file = new File([blob], "dwaniyojana.png", { type: "image/png" });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          navigator.share({ files: [file], text: shareText() + " " + shareUrl() }).catch(function () {});
        } else {
          var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "dwaniyojana.png"; document.body.appendChild(a); a.click(); a.remove();
        }
      }, "image/png");
    });
  }

  // Speaking an answer: the browser turns speech into words; the server says what the words mean for THIS question (the same readers
  // the spoken forms use). Where the browser cannot listen the button is simply not shown.
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition, listening = null;
  function say(msg) { $("heard").textContent = msg; }
  function heardAs(q, said) {
    say("\u201C" + said + "\u201D");
    if (!q.required && /छोड़|छोड|skip/i.test(said)) { answer(q, undefined); return; }
    fetch("yojana/understand", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ question: q.id, text: said, lang: lang }) })
      .then(function (r) { if (!r.ok) throw 0; return r.json(); })
      .then(function (d) { if (current !== q) return; if (d.value === null || d.value === undefined) say("\u201C" + said + "\u201D \u2014 " + t("not_understood")); else answer(q, d.value); })
      .catch(function () { say(t("err")); });
  }
  if (SR) {
    $("voice").hidden = false;
    $("mic").onclick = function () {
      if (!current) return;
      if (listening) { try { listening.stop(); } catch (e) {} return; }
      var q = current, r = new SR(), gotSomething = false;
      r.lang = lang === "hi" ? "hi-IN" : "en-IN"; r.interimResults = false; r.maxAlternatives = 1; listening = r;
      $("mic").classList.add("on"); say(t("listening"));
      r.onresult = function (e) { gotSomething = true; heardAs(q, e.results[0][0].transcript); };
      r.onerror = function (e) { gotSomething = true; say(e.error === "not-allowed" || e.error === "service-not-allowed" ? t("mic_denied") : t("no_hear")); };
      r.onend = function () { listening = null; $("mic").classList.remove("on"); if (!gotSomething) say(t("no_hear")); };
      try { r.start(); } catch (e) { listening = null; $("mic").classList.remove("on"); }
    };
  }

  $("go").onclick = begin;
  $("say").onclick = function () {
    if (!window.speechSynthesis || !current) return;
    speechSynthesis.cancel(); var u = new SpeechSynthesisUtterance($("qh").textContent); u.lang = lang === "hi" ? "hi-IN" : "en-IN"; u.rate = .9; speechSynthesis.speak(u);
  };
  if (!window.speechSynthesis) $("say").hidden = true;
  document.querySelectorAll(".lang button").forEach(function (b) {
    b.onclick = function () {
      if (b.dataset.l === lang) return;
      lang = b.dataset.l; apply(); questions = [];
      if (!$("ask").hidden && current) { var id = current.id; getQuestions().then(function () { ask(questions.filter(function (q) { return q.id === id; })[0]); }); }
      else if (!$("out").hidden && last) finish();
    };
  });
  apply();
})();
</script>
</body>
</html>
