# DwaniLive Careers -- FIRST-RUN DEFAULTS ONLY.
# After deploying, change everything from the website itself:
#   Admin -> Settings  (organisation, signatory, signature image, offer defaults)
#   Admin -> Roles     (roles, questions, openings, closing dates)
# Secrets are CAREERS_* environment variables on the DwaniLive Render service: see careers/README.md.

[org]
name = "DwaniLive"
# Name that legally issues the letter. If DwaniLive isn't a registered
# company yet, use the founder's name, e.g. "Khushi Mittal (Founder, DwaniLive)".
legal_name = "DwaniLive"
tagline = "Offline live speech translation for in-person events"
address = "New Delhi, India"
website = "https://dhwani-elit.onrender.com"
email = "khushimittal070906@gmail.com"
# Prefix for document numbers: DL-OFF-2026-0001, DL-CERT-2026-0001
doc_prefix = "DL"

[signatory]
name = "Khushi Mittal"
title = "Founder"
# Optional transparent PNG of your signature (e.g. assets/signature.png).
# Leave empty to print a signature line instead.
signature_image = ""

[offer_defaults]
mode = "Remote"
hours_per_week = 15
stipend = "Unpaid (performance-based stipend may be offered)"
accept_within_days = 5
notice_days = 7
reporting_to = "Khushi Mittal, Founder"

# One block per role you hire for. `key` is what you pass to --role.
[[roles]]
key = "ml"
open = false
title = "Machine Learning Intern"
question = "Tell us about one ML or data project you built. What was the hardest part?"
summary = "Make live speech recognition and translation work better for Indian languages and accents."
looking_for = ["Comfortable with Python", "Has trained or fine-tuned at least one model (coursework counts)", "Curious about speech and language"]
keywords = ["python", "pytorch", "machine learning", "nlp", "speech", "whisper", "transformers", "asr", "translation"]
duties = [
  "Evaluating and improving speech recognition and translation quality for Indian languages",
  "Building benchmarks for latency and accuracy on real lecture audio",
  "Documenting experiments and results for the team",
]

[[roles]]
key = "fullstack"
open = false
title = "Full-Stack Developer Intern"
question = "Share a link to something you built for the web and tell us what you would improve in it."
summary = "Build the website, dashboard and the real-time caption pages thousands of attendees see."
looking_for = ["HTML/CSS/JavaScript", "Some backend experience (FastAPI, Node, Django...)", "Cares about speed and accessibility"]
keywords = ["javascript", "react", "fastapi", "python", "html", "css", "websocket", "postgres"]
duties = [
  "Building and improving the DwaniLive website, dashboard and caption pages",
  "Improving real-time features and accessibility of the caption interface",
  "Writing tests and fixing bugs reported by users",
]

[[roles]]
key = "growth"
open = false
title = "Growth & Partnerships Intern"
question = "Describe an event, club activity or campaign you helped organise or promote. What was the result?"
summary = "Bring DwaniLive to colleges, conferences and events across India."
looking_for = ["Clear written and spoken communication", "Has organised or promoted an event, club or fest", "Self-starter"]
keywords = ["marketing", "sales", "outreach", "content", "events", "communication", "canva", "linkedin"]
duties = [
  "Reaching out to colleges, conference organisers and event teams to run pilots",
  "Creating content such as posts, demo videos and case studies",
  "Collecting feedback from pilot users for the product team",
]

# ---------------------------------------------------------------------------
# Intern roles for DwaniLive's own projects.
# FIRST ROUND: only speech-research, backend-platform and frontend-accessibility are open.
# `open` here is the plan; on an existing site, Admin -> Roles -> "Apply opening plan" applies it.
# ---------------------------------------------------------------------------

[[roles]]
key = "speech-research"
title = "Speech & Language Research Intern"
summary = "Make live captions more accurate and easier to read, and publish what you learn."
openings = 2
open = true
question = "Describe an experiment you ran where the result surprised you. What did you change afterwards?"
duties = [
  "Running experiments on speech recognition and translation quality for Indian languages",
  "Building evaluation sets and benchmarks from real lecture audio",
  "Writing up results so the team and the research community can use them",
]
looking_for = [
  "Python and some experience with PyTorch or similar",
  "You've run an experiment and reported the numbers honestly",
  "Curious about speech, Hindi/English code-switching or low-resource languages",
]
keywords = [
  "whisper",
  "asr",
  "speech",
  "nlp",
  "pytorch",
  "evaluation",
  "wer",
  "transformers",
  "audio",
  "python",
  "research",
]
projects = [
  "Smarter caption segmentation :: Captions currently appear when the speaker pauses. Measure how often sentences get cut off or merged, then tune the audio segmenter. :: Before/after numbers and the tuned settings",
  "Language auto-detect :: Detect when a speaker switches between Hindi and English mid-talk and switch models without a restart. :: Detector plus an accuracy report",
  "Quantization study :: Benchmark Whisper sizes and int8/int4 on 4 GB, 8 GB and 16 GB laptops. :: Speed vs accuracy table and a recommended default per RAM size",
  "Noise robustness :: Test with classroom noise, fans, echo and different accents; find where recognition breaks and fix the worst cases. :: Test set and failure report",
  "Punctuation and sentence restoration :: Add punctuation and sentence boundaries so live captions are easier to read. :: Model or rules plus a readability comparison",
  "Translation confidence :: Flag low-confidence translations so readers know to double-check them. :: Confidence score and a UI mock-up",
]

[[roles]]
key = "backend-platform"
title = "Backend & Platform Intern"
summary = "Make the hiring portal and its services reliable, secure and ready for many organisations."
openings = 2
open = true
question = "Tell us about a backend you built. What broke first when it got real use?"
duties = [
  "Building background jobs, APIs and security features for the careers portal",
  "Writing tests and keeping the project easy to run for new contributors",
  "Measuring performance and fixing what breaks under load",
]
looking_for = [
  "Python (FastAPI, Flask or Django) and SQL",
  "You've built a backend that real people used",
  "Interested in reliability, security and clean design",
]
keywords = [
  "python",
  "fastapi",
  "postgres",
  "sql",
  "docker",
  "redis",
  "api",
  "testing",
  "linux",
  "django",
  "flask",
  "backend",
]
projects = [
  "Postgres job queue :: Move email and PDF sending to a durable queue (SELECT ... FOR UPDATE SKIP LOCKED) with retries, backoff and idempotency. :: Queue module with tests that survive a server restart",
  "Migrations and Docker :: Add Alembic migrations and a Docker setup so anyone can run the portal with one command. :: docker compose up works, with a migration history",
  "Two-factor login and audit log :: TOTP two-factor login for admins and a searchable audit trail of every action. :: 2FA flow and an audit page",
  "Public API and webhooks :: API keys and signed webhooks so other tools can read applicants and receive status changes. :: Documented API and webhook delivery tests",
  "Object storage :: Store resumes and PDFs in Supabase Storage or S3 and serve them with time-limited signed URLs. :: Migration script and a benchmark against database storage",
  "Load test :: Simulate hundreds of applications and measure requests per second and p95 latency. :: Locust or k6 script and a one-page report",
]

