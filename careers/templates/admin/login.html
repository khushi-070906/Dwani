{% extends "base.html" %}
{% block sitenav_assets %}{% endblock %}
{% block header %}
<header class="site-header admin-header"><div class="wrap">
  <a class="brand" href="{{ P }}/admin"><span class="dwani" lang="hi">ध्वनि</span><span class="live">Live</span><span class="careers">Hiring</span></a>
</div></header>
{% endblock %}
{% block title %}Team login · {{ org.name }}{% endblock %}
{% block nav %}{% endblock %}
{% block content %}
<section class="wrap" style="max-width:420px;padding:3rem 1.25rem">
  <div class="card">
    <h1 style="font-size:1.35rem;margin:0 0 .4rem">Team login</h1>
    <form method="post" action="{{ P }}/admin/login">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <label for="email">Email</label>
      <input id="email" type="email" name="email" autocomplete="username" autofocus required>
      <label for="password">Password</label>
      <input id="password" type="password" name="password" autocomplete="current-password" required>
      <button class="btn block" type="submit">Log in</button>
    </form>
  </div>
</section>
{% endblock %}
