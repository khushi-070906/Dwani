services:
  - type: web
    name: dwanilive-license-server
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn license_server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: LDST_LICENSE_PRIVATE_KEY
        sync: false
      - key: LDST_DB_PATH
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: RAZORPAY_PLAN_PRO_MONTHLY
        sync: false
      - key: RAZORPAY_PLAN_PRO_ANNUAL
        sync: false
      - key: RAZORPAY_PLAN_INSTITUTION_MONTHLY
        sync: false
      - key: RAZORPAY_PLAN_INSTITUTION_ANNUAL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
    disk:
      name: license-db
      mountPath: /var/data
      sizeGB: 1