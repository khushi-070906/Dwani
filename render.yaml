services:
  - type: web
    name: dwanilive-license-server
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn license_server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: LDST_LICENSE_PRIVATE_KEY
        sync: false
      # Supabase "Session pooler" connection string (Dashboard -> Connect ->
      # Session pooler, port 5432). See license_server.py's module docstring
      # for why this one specifically, not the Direct or Transaction pooler
      # connection strings Supabase also offers.
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: RAZORPAY_PLAN_PRO_MONTHLY
        sync: false
      - key: RAZORPAY_PLAN_PRO_ANNUAL
        sync: false
      - key: RAZORPAY_PLAN_INSTITUTION_MONTHLY
        sync: false
      - key: RAZORPAY_PLAN_INSTITUTION_ANNUAL
        sync: false
      # Comma-separated list of allowed origins for CORS, e.g.
      # "https://dhwani-elit.onrender.com". Leave unset (or empty) to allow
      # any origin -- fine as long as pricing/login/dashboard stay served
      # from this same app, since then no request is actually cross-origin.
      - key: ALLOWED_ORIGINS
        sync: false
      # Gmail address + a 16-character "App Password" (NOT your normal Gmail
      # password) used to send password-reset OTP emails. Generate one at
      # myaccount.google.com/apppasswords (requires 2-Step Verification on
      # that Google account).
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      # ---- Careers portal at /careers (careers/README.md) ----
      - key: CAREERS_PUBLIC_URL          # printed in every certificate QR: set before issuing documents
        value: https://dhwani-elit.onrender.com/careers
      - key: CAREERS_ADMIN_EMAIL         # owner login for /careers/admin
        sync: false
      - key: CAREERS_ADMIN_PASSWORD
        sync: false
      - key: CAREERS_SESSION_SECRET
        generateValue: true
      - key: CAREERS_SIGNING_KEY         # python -m careers.credentials new-key  (keep a backup)
        sync: false
      # Opens /admin/crash-reports?token=... (error reports users choose to send). Unset = page disabled.
      - key: REPORTS_TOKEN
        generateValue: true

  # DwaniForms website (its own site; the DwaniForms app itself runs on kiosks, not here)
  - type: web
    name: dwaniforms-site
    runtime: static
    staticPublishPath: ./dwaniforms_site

  # DwaniForms app online, so people can use it from home (typed answers + browser voice typing).
  # Fictional demo records only; real land/ration data stays on centre kiosks.
  - type: web
    name: dwaniforms-app
    runtime: python
    plan: free
    buildCommand: pip install -r dwaniforms/requirements-web.txt
    startCommand: python -m dwaniforms.standalone --text-only --demo-records --browser-voice --host 0.0.0.0 --port $PORT
    healthCheckPath: /form/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DWANIFORMS_TRUST_PROXY        # Render sits behind a proxy: rate limits per real visitor
        value: "1"
      - key: DWANIFORMS_METRICS_TOKEN      # opens /form/metrics (anonymous counts) for whoever sends it
        generateValue: true
